name: Publish Packages

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (leave empty to use default)'
        required: false
        default: ''
      module:
        description: 'Module to publish (leave empty to publish all)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          VERSION_ARG=""
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_ARG="-Pversion=${{ github.event.inputs.version }}"
          fi
          MODULE="${{ github.event.inputs.module }}"
          if [ -n "$MODULE" ]; then
            ./gradlew :$MODULE:publishAllPublicationsToGitHubPackagesRepository $VERSION_ARG
          else
            ./gradlew publishAllPublicationsToGitHubPackagesRepository $VERSION_ARG --continue
          fi
